server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (defense in depth — the API sets its own via helmet;
    # this covers the static shell/HTML response itself).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # img-src/connect-src allow https: broadly since the API and uploaded
    # images (Supabase Storage / a CDN) can be on a different origin than
    # this static frontend, and that origin isn't known at nginx-config
    # build time (VITE_API_BASE_URL is set per-deployment). Tighten both to
    # the specific API + storage/CDN origins once those are fixed for a
    # given deployment; frame-ancestors/object-src stay locked down regardless.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cache hashed build assets aggressively; never cache the HTML shell so
    # deploys are picked up immediately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
