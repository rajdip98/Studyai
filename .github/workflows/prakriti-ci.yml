name: Prakriti Healthcare CI

on:
  pull_request:
    paths:
      - "prakriti-healthcare/**"
      - ".github/workflows/prakriti-ci.yml"
  push:
    branches: [main]
    paths:
      - "prakriti-healthcare/**"

concurrency:
  group: prakriti-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prakriti-healthcare/backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prakriti
          POSTGRES_PASSWORD: prakriti
          POSTGRES_DB: prakriti_healthcare_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prakriti"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://prakriti:prakriti@localhost:5432/prakriti_healthcare_test
      REDIS_URL: redis://localhost:6379
      CORS_ORIGINS: http://localhost:5173
      JWT_ACCESS_SECRET: ci-access-secret-please-change-0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-please-change-0123456789
      COOKIE_SECRET: ci-cookie-secret-please-change-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: prakriti-healthcare/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Unit + integration tests
        run: npm test
        env:
          INTEGRATION: "1"

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
        continue-on-error: true # surfaces findings without blocking merges; review manually

      - name: Build
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prakriti-healthcare/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: prakriti-healthcare/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
        continue-on-error: true

  container-security-scan:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t prakriti-backend:ci ./prakriti-healthcare/backend

      - name: Build frontend image
        run: docker build -t prakriti-frontend:ci ./prakriti-healthcare/frontend

      - name: Scan images for known vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: prakriti-backend:ci
          severity: "CRITICAL,HIGH"
          exit-code: "0" # report-only; flip to "1" once the baseline is clean to hard-fail CI

      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: prakriti-frontend:ci
          severity: "CRITICAL,HIGH"
          exit-code: "0"
